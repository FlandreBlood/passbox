<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Passbox Status Board</title>
  <style>
    :root {
      color-scheme: light dark;
      --pb-bg: var(--color-background-primary, var(--background, #f6f7f9));
      --pb-surface: var(--color-background-secondary, var(--card, #ffffff));
      --pb-surface-subtle: var(--color-background-tertiary, var(--muted, #eef1f5));
      --pb-surface-code: #f1f4f9;
      --pb-fg: var(--color-text-primary, var(--foreground, #151921));
      --pb-fg-2: var(--color-text-secondary, var(--secondary-foreground, #3f4756));
      --pb-fg-muted: var(--color-text-tertiary, var(--muted-foreground, #6b7485));
      --pb-border: var(--color-border-primary, var(--card-border, rgba(15, 23, 42, 0.11)));
      --pb-border-soft: var(--color-border-secondary, var(--border, rgba(15, 23, 42, 0.065)));
      --pb-accent: var(--primary, #2563eb);
      --pb-coord: #4f46e5;
      --pb-coord-bg: rgba(79, 70, 229, 0.10);
      --pb-reason: #7c3aed;
      --pb-reason-bg: rgba(124, 58, 237, 0.07);
      --pb-ok: #15803d;
      --pb-ok-bg: rgba(21, 128, 61, 0.11);
      --pb-warn: #b45309;
      --pb-warn-bg: rgba(217, 119, 6, 0.12);
      --pb-err: #dc2626;
      --pb-err-bg: rgba(220, 38, 38, 0.10);
      --pb-info: #2563eb;
      --pb-info-bg: rgba(37, 99, 235, 0.10);
      --pb-neutral-bg: rgba(100, 116, 139, 0.11);
      --pb-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --pb-shadow-md: 0 2px 8px rgba(15, 23, 42, 0.06);
      --pb-font: var(--font-sans, var(--font-family, "Google Sans Flex", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif));
      --pb-mono: var(--editor-font-family, "Google Sans Code", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
      --r-sm: 5px;
      --r-md: 8px;
      --r-lg: 11px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --pb-bg: var(--color-background-primary, var(--background, #0f1116));
      --pb-surface: var(--color-background-secondary, var(--card, #171a21));
      --pb-surface-subtle: var(--color-background-tertiary, var(--muted, #1f242e));
      --pb-surface-code: #12151b;
      --pb-fg: var(--color-text-primary, var(--foreground, #eef1f6));
      --pb-fg-2: var(--color-text-secondary, var(--secondary-foreground, #c5ccd8));
      --pb-fg-muted: var(--color-text-tertiary, var(--muted-foreground, #8a94a6));
      --pb-border: var(--color-border-primary, var(--card-border, rgba(255, 255, 255, 0.11)));
      --pb-border-soft: var(--color-border-secondary, var(--border, rgba(255, 255, 255, 0.065)));
      --pb-accent: var(--primary, #60a5fa);
      --pb-coord: #818cf8;
      --pb-coord-bg: rgba(129, 140, 248, 0.14);
      --pb-reason: #a78bfa;
      --pb-reason-bg: rgba(167, 139, 250, 0.09);
      --pb-ok: #4ade80;
      --pb-ok-bg: rgba(74, 222, 128, 0.13);
      --pb-warn: #fbbf24;
      --pb-warn-bg: rgba(251, 191, 36, 0.14);
      --pb-err: #f87171;
      --pb-err-bg: rgba(248, 113, 113, 0.14);
      --pb-info: #60a5fa;
      --pb-info-bg: rgba(96, 165, 250, 0.14);
      --pb-neutral-bg: rgba(148, 163, 184, 0.14);
      --pb-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --pb-shadow-md: 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: var(--pb-font);
      font-size: 13px;
      line-height: 1.5;
      color: var(--pb-fg);
      background: var(--pb-bg);
      -webkit-font-smoothing: antialiased;
    }
    body.mode-inline { background: transparent; }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: 0;
      background: transparent;
    }
    code, .mono {
      font-family: var(--pb-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Subtle Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--pb-border);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--pb-fg-muted); }

    .app-shell {
      max-width: none;
      margin: 0 auto;
      padding: 0 12px 14px;
    }
    body.mode-inline .app-shell {
      padding: 4px 2px 6px;
    }

    /* Top bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--pb-bg);
      border-bottom: 1px solid var(--pb-border);
      padding: 9px 0 8px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    body.mode-inline .topbar {
      position: static;
      background: transparent;
      padding: 2px 0 6px;
      margin-bottom: 8px;
    }
    .topbar-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .brand-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--pb-info-bg), var(--pb-coord-bg));
      color: var(--pb-info);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11px;
      border: 1px solid rgba(37, 99, 235, 0.28);
      flex: none;
    }
    .brand-title {
      font-size: 13.5px;
      font-weight: 650;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--pb-fg-2);
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--pb-surface);
      border: 1px solid var(--pb-border-soft);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pb-fg-muted);
      position: relative;
      flex: none;
    }
    .dot.pulse { background: var(--pb-ok); }
    .dot.pulse::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 1.5px solid var(--pb-ok);
      opacity: 0.6;
      animation: pb-ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .dot.ok { background: var(--pb-ok); }
    .dot.warn { background: var(--pb-warn); }
    .dot.err { background: var(--pb-err); }
    @keyframes pb-ping {
      0% { transform: scale(0.9); opacity: 0.75; }
      80%, 100% { transform: scale(2.1); opacity: 0; }
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .default-model-chip {
      font-size: 11px;
      color: var(--pb-fg-2);
      background: var(--pb-surface);
      border: 1px solid var(--pb-border-soft);
      padding: 2px 8px;
      border-radius: var(--r-sm);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .seg-group {
      display: inline-flex;
      background: var(--pb-surface-subtle);
      border: 1px solid var(--pb-border-soft);
      border-radius: 6px;
      padding: 1px;
    }
    .seg-btn {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      color: var(--pb-fg-muted);
      font-weight: 500;
      transition: all 0.12s ease;
    }
    .seg-btn:hover { color: var(--pb-fg); }
    .seg-btn.active {
      background: var(--pb-surface);
      color: var(--pb-fg);
      box-shadow: var(--pb-shadow-sm);
    }
    .icon-btn {
      height: 24px;
      padding: 0 8px;
      border-radius: 5px;
      font-size: 11.5px;
      color: var(--pb-fg-2);
      background: var(--pb-surface);
      border: 1px solid var(--pb-border-soft);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
    }
    .icon-btn:hover {
      border-color: var(--pb-border);
      color: var(--pb-fg);
      background: var(--pb-surface-subtle);
    }
    .icon-btn[aria-pressed="true"] {
      border-color: var(--pb-accent);
      color: var(--pb-accent);
      background: var(--pb-info-bg);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .filter-tab {
      font-size: 11.5px;
      padding: 3px 9px;
      border-radius: 999px;
      color: var(--pb-fg-muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid transparent;
    }
    .filter-tab:hover { color: var(--pb-fg); background: var(--pb-surface-subtle); }
    .filter-tab.active {
      color: var(--pb-fg);
      background: var(--pb-surface);
      border-color: var(--pb-border);
      font-weight: 600;
      box-shadow: var(--pb-shadow-sm);
    }
    .count-num {
      font-family: var(--pb-mono);
      font-size: 10.5px;
      opacity: 0.8;
    }

    /* Workbench Split Layout */
    .workbench {
      display: grid;
      gap: 12px;
      align-items: start;
    }
    .master, .inspector {
      min-width: 0;
      overflow: auto;
      scrollbar-gutter: stable;
    }
    @media (min-width: 760px) {
      body:not(.mode-inline) .workbench { grid-template-columns: clamp(300px, 30vw, 370px) minmax(0, 1fr); }
      body:not(.mode-inline) .master,
      body:not(.mode-inline) .inspector { max-height: max(300px, calc(100vh - 96px)); }
    }
    @media (max-width: 759.98px) {
      .workbench .inspector { display: none; }
      .workbench.show-detail .master { display: none; }
      .workbench.show-detail .inspector { display: block; animation: enter-pane 140ms ease-out; }
      .back-button { display: inline-flex; }
    }
    body.mode-inline .workbench { display: block; }
    body.mode-inline .master,
    body.mode-inline .inspector { max-height: none; overflow: visible; }
    body.mode-inline .workbench:not(.show-detail) .inspector,
    body.mode-inline .workbench.show-detail .master { display: none; }
    body.mode-inline .back-button { display: inline-flex; }
    .back-button { display: none; margin-bottom: 6px; }
    @keyframes enter-pane { from { opacity: .5; transform: translateX(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .workbench.show-detail .inspector { animation: none; } }

    /* Chips & Badges */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10.5px;
      line-height: 1.45;
      background: var(--pb-surface-subtle);
      color: var(--pb-fg-2);
      white-space: nowrap;
    }
    .chip.clickable:hover {
      color: var(--pb-fg);
      outline: 1px solid var(--pb-border);
    }
    .chip.ok { background: var(--pb-ok-bg); color: var(--pb-ok); font-weight: 600; }
    .chip.warn { background: var(--pb-warn-bg); color: var(--pb-warn); font-weight: 600; }
    .chip.err { background: var(--pb-err-bg); color: var(--pb-err); font-weight: 600; }
    .chip.info { background: var(--pb-info-bg); color: var(--pb-info); font-weight: 600; }
    .chip.neutral { background: var(--pb-neutral-bg); color: var(--pb-fg-2); }

    .diff-stat {
      font-family: var(--pb-mono);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    .ins { color: var(--pb-ok); }
    .del { color: var(--pb-err); }

    /* Master Task Cards */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 4px;
    }
    .task-card {
      background: var(--pb-surface);
      border: 1px solid var(--pb-border);
      border-radius: var(--r-lg);
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--pb-shadow-sm);
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .task-card:hover {
      border-color: var(--pb-fg-muted);
    }
    .task-card.is-running {
      border-color: rgba(21, 128, 61, 0.45);
    }
    .task-card.is-attention {
      border-color: rgba(220, 38, 38, 0.42);
    }
    .task-card.selected {
      border-color: var(--pb-accent);
      box-shadow: inset 3px 0 0 var(--pb-accent), var(--pb-shadow-md);
    }

    .card-head {
      padding: 9px 11px 7px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      user-select: none;
    }
    .head-left {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
      flex: 1;
    }
    .head-dot-wrap {
      padding-top: 5px;
      flex: none;
    }
    .task-objective {
      font-size: 12.5px;
      font-weight: 650;
      line-height: 1.38;
      color: var(--pb-fg);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .head-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex: none;
    }

    .agent-lanes {
      padding: 0 10px 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .agent-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 6px;
      padding: 4px 7px;
      border-radius: var(--r-sm);
      background: var(--pb-surface-subtle);
      border: 1px solid var(--pb-border-soft);
    }
    .role-cell {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .role-tag {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 4.5px;
      border-radius: 3px;
      letter-spacing: 0.02em;
      flex: none;
    }
    .role-tag.coord { background: var(--pb-coord-bg); color: var(--pb-coord); }
    .role-tag.exec { background: var(--pb-ok-bg); color: var(--pb-ok); }
    .model-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--pb-fg);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .model-label.unrecorded {
      font-weight: 400;
      color: var(--pb-fg-muted);
    }
    .status-cell {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .right-cell {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }
    .timer {
      font-family: var(--pb-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--pb-fg-2);
    }
    .timer.live {
      color: var(--pb-info);
      font-weight: 650;
    }

    .card-ticker {
      margin: 0 10px 7px;
      padding: 3px 7px;
      border-radius: var(--r-sm);
      background: var(--pb-surface-code);
      border: 1px solid var(--pb-border-soft);
      font-family: var(--pb-mono);
      font-size: 10.5px;
      color: var(--pb-fg-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-foot {
      padding: 5px 11px 7px;
      border-top: 1px solid var(--pb-border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 10.5px;
      color: var(--pb-fg-muted);
      flex-wrap: wrap;
    }
    .card-foot-meta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex-wrap: wrap;
    }

    /* Inspector Pane */
    .inspector {
      background: var(--pb-surface);
      border: 1px solid var(--pb-border);
      border-radius: var(--r-lg);
      box-shadow: var(--pb-shadow-sm);
    }
    .inspector-empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--pb-fg-muted);
    }
    .inspector-head {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--pb-surface);
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--pb-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .inspector-head-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .inspector h2 {
      margin: 0 0 4px;
      font-size: 15.5px;
      line-height: 1.35;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    .inspector-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      color: var(--pb-fg-muted);
    }
    .danger-btn {
      font-size: 11.5px;
      padding: 4px 9px;
      border-radius: 5px;
      background: var(--pb-err-bg);
      color: var(--pb-err);
      border: 1px solid rgba(220, 38, 38, 0.32);
      font-weight: 600;
      flex: none;
    }
    .danger-btn:hover { background: rgba(220, 38, 38, 0.18); }

    .rev-selector {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .rev-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--pb-surface-subtle);
      border: 1px solid var(--pb-border-soft);
      color: var(--pb-fg-2);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .rev-pill:hover { border-color: var(--pb-border); color: var(--pb-fg); }
    .rev-pill.active {
      background: var(--pb-surface);
      border-color: var(--pb-accent);
      color: var(--pb-fg);
      font-weight: 600;
      box-shadow: var(--pb-shadow-sm);
    }

    .detail-drawer {
      background: var(--pb-bg);
      padding: 12px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Hero Summary Band */
    .hero-band {
      background: var(--pb-surface);
      border: 1px solid var(--pb-border);
      border-radius: var(--r-md);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .handoff-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11.5px;
    }
    .handoff-route {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .handoff-node {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--pb-surface-subtle);
      border: 1px solid var(--pb-border-soft);
    }
    .handoff-arrow {
      color: var(--pb-fg-muted);
      font-weight: 700;
    }
    .src-badge {
      font-size: 10px;
      color: var(--pb-fg-muted);
      border: 1px solid var(--pb-border-soft);
      background: var(--pb-surface);
      padding: 0 4px;
      border-radius: 3px;
    }

    /* Labeled Phase Progress Bar */
    .phase-track {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
      padding: 6px 8px;
      border-radius: var(--r-sm);
      background: var(--pb-surface-subtle);
    }
    .phase-node {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--pb-fg-muted);
      min-width: 0;
    }
    .phase-node-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 700;
      background: var(--pb-surface);
      border: 1px solid var(--pb-border);
      flex: none;
    }
    .phase-node.done { color: var(--pb-ok); }
    .phase-node.done .phase-node-dot {
      background: var(--pb-ok-bg);
      border-color: var(--pb-ok);
      color: var(--pb-ok);
    }
    .phase-node.current { color: var(--pb-info); font-weight: 650; }
    .phase-node.current .phase-node-dot {
      background: var(--pb-info);
      border-color: var(--pb-info);
      color: #ffffff;
      box-shadow: 0 0 0 3px var(--pb-info-bg);
    }
    .phase-node-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Three-Way Firewall Strip */
    .firewall-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    @media (max-width: 560px) {
      .firewall-grid { grid-template-columns: 1fr; }
      .phase-track { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .fw-box {
      background: var(--pb-surface-subtle);
      border: 1px solid var(--pb-border-soft);
      border-top: 2.5px solid var(--pb-border);
      border-radius: var(--r-md);
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fw-box.tone-ok { border-top-color: var(--pb-ok); }
    .fw-box.tone-info { border-top-color: var(--pb-info); }
    .fw-box.tone-warn { border-top-color: var(--pb-warn); }
    .fw-box.tone-err { border-top-color: var(--pb-err); }
    .fw-label {
      font-size: 10.5px;
      color: var(--pb-fg-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .fw-value {
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .fw-sub {
      font-size: 10.5px;
      color: var(--pb-fg-muted);
      font-family: var(--pb-mono);
    }

    /* Token Efficiency Bar */
    .token-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--pb-border-soft);
      font-size: 11px;
      color: var(--pb-fg-muted);
    }
    .token-metrics {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Sections inside Detail */
    .detail-section {
      background: var(--pb-surface);
      border: 1px solid var(--pb-border-soft);
      border-radius: var(--r-md);
      padding: 9px 11px;
    }
    .sec-title {
      font-size: 11.5px;
      font-weight: 650;
      color: var(--pb-fg-2);
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .claim-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .claim-item {
      font-size: 12.5px;
      line-height: 1.55;
      padding: 7px 9px;
      border-radius: 6px;
      background: var(--pb-surface-subtle);
      border-left: 3px solid var(--pb-border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-wrap: anywhere;
    }
    .claim-item.is-blocker { border-left-color: var(--pb-err); }
    .claim-item.is-counter { border-left-color: var(--pb-info); }
    .claim-head {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .claim-idx {
      font-family: var(--pb-mono);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--pb-fg-muted);
      padding-top: 2px;
      flex: none;
    }
    .claim-ev {
      font-family: var(--pb-mono);
      font-size: 11px;
      color: var(--pb-fg-2);
      align-self: flex-start;
      overflow-wrap: anywhere;
    }
    button.claim-ev, button.file-path {
      color: var(--pb-info);
      text-align: left;
      min-width: 0;
    }
    button.claim-ev:hover, button.file-path:hover { text-decoration: underline; }

    /* Changed Files */
    .file-grid {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .file-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      font-family: var(--pb-mono);
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 5px;
    }
    .file-row:hover { background: var(--pb-surface-subtle); }
    .file-path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .diff-bar {
      width: 44px;
      height: 5px;
      border-radius: 999px;
      background: var(--pb-surface-subtle);
      overflow: hidden;
      display: inline-flex;
    }
    .diff-bar-ins { background: var(--pb-ok); height: 100%; }
    .diff-bar-del { background: var(--pb-err); height: 100%; }

    .stream-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 7px;
    }
    .stream-filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 7px;
    }
    .stream-list {

      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stream-row {
      border: 1px solid var(--pb-border-soft);
      border-left: 3px solid var(--pb-border);
      border-radius: 6px;
      padding: 7px 9px;
      background: var(--pb-surface-subtle);
      overflow-wrap: anywhere;

    .stream-row.kind-command_execution,

      background: var(--pb-reason-bg);
    }
    .stream-row.kind-file_change { border-left-color: var(--pb-ok); }
    .stream-row.kind-error {
      border-left-color: var(--pb-err);
      background: var(--pb-err-bg);
    }
    .stream-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: var(--pb-fg-muted);
      margin-bottom: 4px;
    }
    .stream-prose {
      font-size: 12px;
      line-height: 1.55;
      color: var(--pb-fg);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .inspector pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 11.5px/1.5 var(--pb-mono);
      margin: 4px 0 0;
      padding: 6px 8px;
      border-radius: 5px;
      background: var(--pb-surface-code);
      border: 1px solid var(--pb-border-soft);
      user-select: text;
    }
    .inspector summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 11.5px;
      color: var(--pb-fg-2);
      list-style: none;
    }
    .inspector summary::-webkit-details-marker { display: none; }
    .disclosure-arrow {
      display: inline-block;
      width: 12px;
      font-size: 11px;
      color: var(--pb-fg-muted);
      transition: transform 0.14s ease;
      flex: none;
    }
    details[open] > summary .disclosure-arrow {
      transform: rotate(90deg);
      color: var(--pb-fg);

      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .prompt-summary:hover, details > summary.sec-title:hover { color: var(--pb-fg); }
    .prompt-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .prompt-body {
      max-height: 200px;
      overflow: auto;
      overscroll-behavior: contain;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease;
    }

      function esc(val) {
        return String(val ?? '')
          .split('&').join('&amp;')
          .split('<').join('&lt;')
          .split('>').join('&gt;')
          .split('"').join('&quot;')
          .split("'").join('&#39;');
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => el.classList.remove('show'), 1800);
      }

      function formatDuration(ms) {
        if (ms === null || ms === undefined || Number.isNaN(ms)) return '—';
        const totalSec = Math.max(0, Math.floor(ms / 1000));
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        if (h > 0) return h + 'h ' + String(m).padStart(2, '0') + 'm';
        if (m > 0) return m + 'm ' + String(s).padStart(2, '0') + 's';
        return s + 's';
      }

      function formatClock(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return '';
        return (
          String(d.getHours()).padStart(2, '0') +
          ':' +
          String(d.getMinutes()).padStart(2, '0') +
          ':' +
          String(d.getSeconds()).padStart(2, '0')
        );
      }

      function formatCompactNum(n) {
        if (typeof n !== 'number' || Number.isNaN(n)) return '0';
        if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
        return String(n);

      // --- Minimal compliant SEP-1865 MCP Apps JSON-RPC 2.0 Client ---
      let rpcSeq = 1;
      const pendingRpc = new Map();

      function sendRpcRequest(method, params) {
        const id = rpcSeq++;
        return new Promise((resolve, reject) => {
          pendingRpc.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
          setTimeout(() => {
            if (pendingRpc.has(id)) {
              pendingRpc.delete(id);
              reject(new Error('RPC timeout: ' + method));
            }
          }, 15000);
        });
      }

      function sendRpcNotification(method, params) {
        window.parent.postMessage({ jsonrpc: '2.0', method, ...(params ? { params } : {}) }, '*');
      }

      function applyHostContext(ctx) {
        if (!ctx || typeof ctx !== 'object') return;
        if (ctx.theme === 'dark' || ctx.theme === 'light') {
          document.documentElement.setAttribute('data-theme', ctx.theme);
        }
        if (ctx.styles && ctx.styles.variables && typeof ctx.styles.variables === 'object') {
          for (const [k, v] of Object.entries(ctx.styles.variables)) {
            if (typeof k === 'string' && k.startsWith('--') && typeof v === 'string') {
              document.documentElement.style.setProperty(k, v);
            }
          }
        }
        if (ctx.containerDimensions && typeof ctx.containerDimensions.maxHeight === 'number') {
          state.displayMode = 'inline';
          state.inlineMaxHeight = Math.min(780, Math.max(320, Math.floor(ctx.containerDimensions.maxHeight)));
          state.lastNotifiedHeight = 0;
          document.body.classList.add('mode-inline');
        }
      }

      function detectAmbientDarkTheme() {
        if (document.documentElement.hasAttribute('data-theme')) return;
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      }

      function detailVisible() {
        const narrow = typeof window.innerWidth === 'number' && window.innerWidth < 760;
        return state.showDetail || (!narrow && state.displayMode !== 'inline');
      }

      function ingestToolPayload(payload, fromPoll) {
        if (!payload || typeof payload !== 'object') return;
        const sc = payload.structuredContent;
        if (sc && Array.isArray(sc.tasks)) {
          const firstArrival = !state.board;
          state.board = sc;
          state.lastUpdatedMs = Date.now();
          if (firstArrival && sc.focus_task_id && !state.initialFocusTaskId) {
            state.initialFocusTaskId = sc.focus_task_id;
          }
          if (firstArrival) state.selectedTaskId = state.initialFocusTaskId || sc.tasks[0]?.task_id;
          schedulePollLoop();
          renderBoard({ fromPoll: Boolean(fromPoll) });
          if (firstArrival && state.selectedTaskId && !sc.task_detail && detailVisible() && state.connected) {
            void pollServerBoard();
          }
          return;
        }
        const textBlock = Array.isArray(payload.content)
          ? payload.content.find((c) => c && c.type === 'text' && typeof c.text === 'string')
          : null;
        if (textBlock) {
          try {
            const parsed = JSON.parse(textBlock.text);
            if (parsed && typeof parsed.task_id === 'string') {
              state.initialFocusTaskId = parsed.task_id;
              state.selectedTaskId = parsed.task_id;
              if (state.displayMode === 'inline') {
                state.inlineFocusedOnly = true;
              }
              void pollServerBoard();
            }
          } catch {}
        }
      }

      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;

        if (Object.prototype.hasOwnProperty.call(msg, 'id') && (msg.result !== undefined || msg.error !== undefined)) {
          const waiter = pendingRpc.get(msg.id);
          if (waiter) {
            pendingRpc.delete(msg.id);
            if (msg.error) waiter.reject(Object.assign(new Error(msg.error.message || 'RPC error'), {
              code: msg.error.code,
            }));
            else waiter.resolve(msg.result);
          }
          return;
        }

        if (msg.method === 'ping' && msg.id !== undefined) {
          window.parent.postMessage({ jsonrpc: '2.0', id: msg.id, result: {} }, '*');
          return;
        }

        if (msg.method === 'ui/notifications/tool-input') {
          const args = msg.params && msg.params.arguments;
          if (args && typeof args.task_id === 'string' && args.task_id) {
            state.initialFocusTaskId = args.task_id;
            state.selectedTaskId = args.task_id;
          }
          return;
        }

        if (msg.method === 'ui/notifications/tool-result') {
          ingestToolPayload(msg.params);
          return;
        }

        if (msg.method === 'ui/notifications/host-context-changed') {
          applyHostContext(msg.params);
          renderBoard();
        }
      });

      async function callServerTool(name, args) {
        return sendRpcRequest('tools/call', { name, arguments: args || {} });
      }

      async function pollServerBoard() {
        if (!state.connected) return;
        clearTimeout(state.pollTimer);
        if (document.hidden) { schedulePollLoop(); return; }
        const sequence = ++state.pollSequence;
        const selected = state.selectedTaskId;
        const runId = selected && state.selectedRunByTask.get(selected);
        const detail = detailVisible();
        try {
          const res = await callServerTool('passbox_status', {
            include_board: true,
            include_detail: detail,
            ...(selected ? { task_id: selected } : {}),
            ...(detail && runId ? { run_id: runId } : {}),
          });
          if (res && sequence === state.pollSequence) ingestToolPayload(res, true);
        } catch {} finally {
          if (sequence === state.pollSequence) schedulePollLoop();
        }
      }

      async function openWorkspaceFileOrCopy(uri, uriWithLine, raw) {
        if (!uri) return;
        if (state.connected) {
          for (const target of uriWithLine && uriWithLine !== uri ? [uriWithLine, uri] : [uri]) {
            try {
              const res = await sendRpcRequest('com.google.antigravity/toggle-aux-pane', {
                tabType: 'fileView',
                uri: target,
              });
              if (res && res.isError) continue;
              if (res && res.error) {
                if (res.error.code === -32601) break;
                continue;
              }
              return;
            } catch (err) {
              if (err.code === -32601) break;
            }
          }
        }
        try {
          await navigator.clipboard.writeText(raw);
          showToast(t('copied') + raw);
        } catch {
          showToast(t('fileOpenFailed'));
        }
      }

      function exitBadgeClass(code) {
        if (code === 'running') return 'info';
        if (code === 'normal') return 'ok';
        if (code === 'canceled') return 'neutral';
        if (code === 'timed_out' || code === 'incomplete_stream') return 'warn';
        return 'err';
      }

      function execStatusBadge(status) {
        if (status === 'running') return { cls: 'info', text: t('execRunning') };
        if (status === 'succeeded') return { cls: 'ok', text: t('execSucceeded') };
        if (status === 'canceled') return { cls: 'neutral', text: t('execCanceled') };
        if (status === 'timed_out') return { cls: 'warn', text: t('execTimedOut') };
        return { cls: 'err', text: t('execFailed') };
      }

      function reportedStatusBadge(rep) {
        if (rep === 'completed') return { cls: 'ok', text: t('repCompleted') };
        if (rep === 'partial') return { cls: 'warn', text: t('repPartial') };
        if (rep === 'blocked') return { cls: 'err', text: t('repBlocked') };
        if (rep === 'invalid') return { cls: 'err', text: t('repInvalid') };
        return { cls: 'neutral', text: t('repMissing') };
      }

      function verifyStatusBadge(ver) {
        if (ver === 'passed') return { cls: 'ok', text: t('verPassed') };
        if (ver === 'failed') return { cls: 'err', text: t('verFailed') };
        if (ver === 'timed_out') return { cls: 'warn', text: t('verTimedOut') };
        if (ver === 'error') return { cls: 'err', text: t('verError') };
        return { cls: 'neutral', text: t('verNotRun') };
      }

      function modeLabel(mode) {
        if (mode === 'initial') return t('modeInitial');
        if (mode === 'resume') return t('modeResume');
        if (mode === 'reset_context') return t('modeReset');
        return mode || '';

      function isTaskAttention(task) {
        if (task.state === 'running') return false;
        const st = task.executor.status;
        return st === 'failed' || st === 'timed_out' || st === 'canceled';
      }

      function matchesStreamFilter(entry, filter) {
        if (filter === 'all') return true;
        if (filter === 'command') return entry.kind === 'command_execution' || entry.kind === 'verify';
        if (filter === 'reasoning') return entry.kind === 'reasoning' || entry.kind === 'agent_message';
        if (filter === 'file') return entry.kind === 'file_change';
        if (filter === 'tool') return entry.kind === 'mcp_tool_call' || entry.kind === 'collab_tool_call' || entry.kind === 'web_search';
        if (filter === 'error') return entry.kind === 'error' || entry.status === 'failed' || entry.status === 'declined';
        return true;
      }

        let jumpBarHtml = '';

          const execText = (activeDetail.resolved_model || t('cliDefault')) +
            (activeDetail.reasoning_effort ? ' · ' + activeDetail.reasoning_effort : '');

          const usage = activeDetail.usage;
          let usageHtml = '';
          if (usage) {
            const inp = usage.input_tokens || 0;
            const cached = usage.cached_input_tokens || 0;
            const newTok = Math.max(0, inp - cached);
            const hitPct = inp > 0 ? Math.round((cached / inp) * 100) : 0;
            usageHtml = '<div class="token-bar">' +
              '<span>' + esc(t('tokensLabel')) + '</span>' +
              '<div class="token-metrics mono">' +
              '<span class="chip neutral">' + esc(t('tokIn')) + ' ' + formatCompactNum(inp) + '</span>' +
              (cached ? '<span class="chip ok">' + esc(t('tokCache')) + ' ' + formatCompactNum(cached) +
                ' (' + esc(t('tokHitRate')) + ' ' + hitPct + '%)</span>' : '') +
              '<span class="chip info">' + esc(t('tokNew')) + ' ' + formatCompactNum(newTok) + '</span>' +
              '<span class="chip neutral">' + esc(t('tokOut')) + ' ' + formatCompactNum(usage.output_tokens || 0) +
                (usage.reasoning_output_tokens ? ' (' + esc(t('tokReason')) + ' ' + formatCompactNum(usage.reasoning_output_tokens) + ')' : '') +
              '</span></div></div>';
          }

          const heroHtml = '<div class="hero-band">' +
            '<div class="handoff-bar">' +
            '<div class="handoff-route">' +
            '<span class="handoff-node"><span class="role-tag coord">' + esc(t('coordRole')) + '</span>' +
            '<span class="model-label">' + esc(coordText) + '</span>' +
            '<span class="chip ' + bridge.cls + '">' + esc(bridge.text) + '</span></span>' +
            '<span class="handoff-arrow" aria-hidden="true">→</span>' +
            '<span class="handoff-node"><span class="role-tag exec">' + esc(t('execRole')) + '</span>' +
            '<span class="model-label mono">' + esc(execText) + '</span>' +
            '<span class="src-badge">' + esc(modelSourceLabel(activeDetail.model_source)) + '</span></span>' +
            '</div>' +
            '<span class="mono chip neutral">' + esc(activeDetail.revision !== null ? 'rev-' + activeDetail.revision : t('unpublishedRun')) +
            ' · ' + esc(formatDuration(rRoundDur)) + '</span>' +
            '</div>' +
            renderLabeledPhaseTrack(activeDetail.execution_status === 'running' ? task.executor.phase : 'completed', activeDetail.execution_status === 'running') +
            '<div class="firewall-grid">' +
            '<div class="fw-box tone-' + exB.cls + '">' +
            '<div class="fw-label"><span>' + esc(t('fwExecTitle')) + '</span><span class="mono">' + esc(formatDuration(rRoundDur)) + '</span></div>' +
            '<div class="fw-value"><span class="chip ' + exB.cls + '">' + esc(exB.text) + '</span>' +
            '<span class="chip ' + rExitCls + '">' + esc(rExitText) + '</span></div>' +
            '<div class="fw-sub">exit_code: ' + esc(activeDetail.exit_code === null ? '—' : activeDetail.exit_code) +
            (activeDetail.thread_id ? ' · thread: ' + esc(activeDetail.thread_id.slice(0, 12)) + '…' : '') + '</div></div>' +
            '<div class="fw-box tone-' + rpB.cls + '">' +
            '<div class="fw-label"><span>' + esc(t('fwReportTitle')) + '</span></div>' +
            '<div class="fw-value"><span class="chip ' + rpB.cls + '">' + esc(rpB.text) + '</span></div>' +
            '<div class="fw-sub">blockers: ' + (activeDetail.unverified_blockers ? activeDetail.unverified_blockers.length : 0) +
            ' · counter: ' + (activeDetail.unverified_counter_evidence ? activeDetail.unverified_counter_evidence.length : 0) + '</div></div>' +
            '<div class="fw-box tone-' + vrB.cls + '">' +
            '<div class="fw-label"><span>' + esc(t('fwVerifyTitle')) + '</span></div>' +
            '<div class="fw-value"><span class="chip ' + vrB.cls + '">' + esc(vrB.text) + '</span></div>' +
            '<div class="fw-sub">commands: ' + (activeDetail.verify_results ? activeDetail.verify_results.length : 0) + '</div></div>' +
            '</div>' +
            usageHtml +
            '</div>';

          const renderClaimsSection = (title, items, kindCls) => {
            if (!Array.isArray(items) || items.length === 0) return '';
            const rows = items.map((it, idx) =>
              '<div class="claim-item ' + kindCls + '">' +
              '<div class="claim-head"><span class="claim-idx">#' + (idx + 1) + '</span><div>' + esc(it.claim) + '</div></div>' +
              (it.evidence ? renderFileReference('claim-ev', it.evidence, it.evidence, it.evidence_link) : '') +
              '</div>'
            ).join('');
            return '<div class="detail-section" data-section-id="claims">' +
              '<div class="sec-title"><span>' + esc(title) + '</span><span class="chip mono neutral">' + items.length + '</span></div>' +
              '<div class="claim-list">' + rows + '</div></div>';
          };

          const dt = activeDetail.delta_totals;
          const filesHtml = Array.isArray(activeDetail.delta_files) && activeDetail.delta_files.length > 0
            ? '<div class="detail-section" data-section-id="files">' +
              '<div class="sec-title"><span>' + esc(t('secFiles')) + '</span>' +
              '<span class="diff-stat">' +
              (dt ? '<span class="ins">+' + dt.insertions + '</span><span class="del">-' + dt.deletions + '</span> · ' : '') +
              '<span class="mono">' + activeDetail.delta_files.length + '</span></span></div>' +
              '<div class="file-grid">' +
              activeDetail.delta_files.map((f) => {
                const totalLines = Math.max(1, (f.insertions || 0) + (f.deletions || 0));
                const insPct = Math.round(((f.insertions || 0) / totalLines) * 100);
                const delPct = 100 - insPct;
                return '<div class="file-row">' +
                  renderFileReference('file-path', '[' + f.status + '] ' + f.path, f.path, f.file_link) +
                  '<span class="diff-bar" aria-hidden="true">' +
                  '<span class="diff-bar-ins" style="width:' + insPct + '%"></span>' +
                  '<span class="diff-bar-del" style="width:' + delPct + '%"></span></span>' +
                  '<span class="diff-stat"><span class="ins">+' + f.insertions + '</span><span class="del">-' + f.deletions + '</span></span></div>';
              }).join('') +
              '</div></div>'
            : '';

          const verifyCmdsHtml = Array.isArray(activeDetail.verify_results) && activeDetail.verify_results.length > 0
            ? '<div class="detail-section">' +
              '<div class="sec-title"><span>' + esc(t('secVerifyCmds')) + '</span></div>' +
              '<div class="claim-list">' +
              activeDetail.verify_results.map((v) =>
                '<div class="claim-item ' + (v.exit_code === 0 && !v.timed_out ? 'is-counter' : 'is-blocker') + '">' +
                '<div class="mono" style="display:flex;justify-content:space-between;gap:8px;align-items:center">' +
                '<span>$ ' + esc((v.argv || []).join(' ')) + '</span>' +
                '<span class="chip ' + (v.exit_code === 0 && !v.timed_out ? 'ok' : 'err') + '">exit=' +
                esc(v.exit_code ?? 'null') + ' (' + formatDuration(v.duration_ms) + ')</span></div>' +
                (v.output_excerpt ? '<pre>' + esc(v.output_excerpt) + '</pre>' : '') +
                '</div>'
              ).join('') +
              '</div></div>'
            : '';

          const eventsHtml = Array.isArray(activeDetail.native_events) && activeDetail.native_events.length > 0
            ? '<div class="detail-section">' +
              '<div class="sec-title"><span>' + esc(t('secEvents')) + '</span></div>' +
              '<div class="claim-list">' +
              activeDetail.native_events.map((ev) =>
                '<div class="claim-item mono" style="font-size:11px;color:var(--pb-fg-2)">' + esc(ev.message) + '</div>'
              ).join('') +
              '</div></div>'
            : '';

          const blockersHtml = renderClaimsSection(t('secBlockers'), activeDetail.unverified_blockers, 'is-blocker');
          const counterHtml = renderClaimsSection(t('secCounter'), activeDetail.unverified_counter_evidence, 'is-counter');
          const streamHtml = renderLiveStreamCard(detail, activeDetail);
          const promptHtml = renderPromptCard(task, detail, activeDetail);
          const activitiesDefaultOpen = activeDetail.execution_status === 'running' &&
            (!detail?.selected_run_live || detail.selected_run_live.entries.length === 0);
          const activitiesHtml = renderActivities(task.task_id, activeDetail, activitiesDefaultOpen);

          const jumpItems = [
            ['prompt', t('jumpPrompt'), Boolean(promptHtml)],
            ['claims', t('jumpClaims'), Boolean(blockersHtml || counterHtml)],
            ['files', t('jumpFiles'), Boolean(filesHtml)],
            ['stream', t('jumpStream'), Boolean(streamHtml)],
            ['activities', t('jumpActivities'), Boolean(activitiesHtml)],
          ].filter((x) => x[2]);
          if (jumpItems.length > 1) {
            jumpBarHtml = '<div class="jump-bar">' + jumpItems.map(([sec, label]) =>
              '<button type="button" class="filter-tab" data-action="jump-section" data-section="' + sec + '">' + esc(label) + '</button>'
            ).join('') + '</div>';
          }

          const orderedSections = activeDetail.execution_status === 'running'
            ? [promptHtml, streamHtml, blockersHtml, counterHtml, filesHtml, verifyCmdsHtml, activitiesHtml, eventsHtml]
            : [promptHtml, blockersHtml, counterHtml, filesHtml, verifyCmdsHtml, streamHtml, activitiesHtml, eventsHtml];

          drawerHtml = '<div class="detail-drawer">' + heroHtml + orderedSections.join('') + '</div>';
        }

        return '<div class="inspector-head">' +
          '<div class="inspector-head-top"><div style="min-width:0;flex:1">' +
          '<button type="button" class="icon-btn back-button" data-action="back">' + esc(t('back')) + '</button>' +
          '<h2>' + esc(task.title || task.objective) + '</h2>' +
          '<div class="inspector-meta">' +
          '<span class="chip mono clickable" data-action="copy-id" data-copy="' + esc(task.task_id) + '">' + esc(task.task_id) + '</span>' +
          '<span class="chip">' + esc(task.workspace_name) + ' · ' + esc(task.workspace_mode === 'worktree' ? t('wsWorktree') : t('wsSnapshot')) + '</span>' +
          '<span class="chip mono">rev-' + esc(task.current_revision) + '</span>' +
          '</div></div>' + cancelBtnHtml + '</div>' +
          revTabsHtml +
          jumpBarHtml +
          '</div>' + drawerHtml;
      }

      function renderTaskCard(task) {
        const isRunning = task.state === 'running';
        const isAttn = isTaskAttention(task);
        const selected = state.selectedTaskId === task.task_id;

        const dotCls = isRunning ? 'dot pulse' : isAttn ? 'dot err' : 'dot ok';
        const cardCls =
          'task-card' +
          (isRunning ? ' is-running' : isAttn ? ' is-attention' : '') +
          (selected ? ' selected' : '');

        const lt = task.ledger_totals || { files_changed: 0, insertions: 0, deletions: 0 };
        const diffHtml =
          lt.files_changed > 0 || lt.insertions > 0 || lt.deletions > 0
            ? '<span class="diff-stat"><span class="ins">+' +
              lt.insertions +
              '</span><span class="del">-' +
              lt.deletions +
              '</span></span>'
            : '<span class="chip neutral">' + esc(t('readOnlyZeroDiff')) + '</span>';

        const coord = task.coordinator;
        const bridge = bridgeBadgeInfo(coord);
        const coordModelHtml = coord.model
          ? '<span class="model-label" title="' + esc(coord.agent + ' · ' + coord.model) + '">' + esc(coord.model) + '</span>'
          : '<span class="model-label unrecorded">' + esc(coord.agent) + ' · ' + esc(t('modelUnrecorded')) + '</span>';

        const exec = task.executor;
        const codexModelText =
          (exec.resolved_model || t('cliDefault')) +
          (exec.reasoning_effort ? ' · ' + exec.reasoning_effort : '');
        const exitReasonObj = exec.exit_reason || { code: 'normal', label_zh: '正常退出', label_en: 'Normal' };
        const exitLabel = state.lang === 'zh' ? exitReasonObj.label_zh : exitReasonObj.label_en;
        const exitCls = exitBadgeClass(exitReasonObj.code);
        const execBadgeCls = isRunning ? 'info' : exitCls;
        const execBadgeText = isRunning ? phaseLabel(exec.phase) : exitLabel;

        const liveMs =
          isRunning && exec.started_at
            ? Math.max(0, Date.now() - Date.parse(exec.started_at))
            : exec.duration_ms;

        return (
          '<article tabindex="0" data-action="select-task" data-task="' + esc(task.task_id) + '" class="' +
          cardCls +
          '" data-task-card="' +
          esc(task.task_id) +
          '">' +
          '<div class="card-head">' +
          '<div class="head-left">' +
          '<div class="head-dot-wrap"><span class="' + dotCls + '"></span></div>' +
          '<div class="task-objective" title="' + esc(task.title || task.objective) + '">' +
          esc(task.title || task.objective) +
          '</div></div>' +
          '<div class="head-right">' +
          diffHtml +
          '</div></div>' +
          '<div class="agent-lanes">' +
          '<div class="agent-row">' +
          '<div class="role-cell">' +
          '<span class="role-tag coord">' + esc(t('coordRole')) + '</span>' +
          coordModelHtml +
          '</div>' +
          '<div class="status-cell"><span class="chip ' + bridge.cls + '">' + esc(bridge.text) + '</span></div>' +
          '<div class="right-cell"><span class="timer">' + esc(formatClock(coord.last_action_at)) + '</span></div>' +
          '</div>' +
          '<div class="agent-row">' +
          '<div class="role-cell">' +
          '<span class="role-tag exec">' + esc(t('execRole')) + '</span>' +
          '<span class="model-label mono" title="' + esc(codexModelText) + '">' + esc(codexModelText) + '</span>' +
          '</div>' +
          '<div class="status-cell"><span class="chip ' + execBadgeCls + '">' + esc(execBadgeText) + '</span></div>' +
          '<div class="right-cell"><span class="timer' + (isRunning ? ' live' : '') + '" data-live-started="' +
          esc(isRunning && exec.started_at ? exec.started_at : '') + '">' + esc(formatDuration(liveMs)) + '</span></div>' +
          '</div>' +
          '</div>' +
          (isRunning && exec.last_event
            ? '<div class="card-ticker" title="' + esc(exec.last_event) + '">▸ ' + esc(exec.last_event) + '</div>'
            : '') +
          '<div class="card-foot">' +
          '<span class="card-foot-meta"><span>' + esc(task.workspace_name) + '</span><span>·</span><span>' +
          esc(task.workspace_mode === 'worktree' ? t('wsWorktree') : t('wsSnapshot')) + '</span><span>·</span><span class="mono">rev-' +
          esc(task.current_revision) + '</span></span>' +
          '<span class="chip mono clickable" data-action="copy-id" data-copy="' + esc(task.task_id) + '">' + esc(task.task_id) + '</span>' +
          '</div>' +
          '</article>'
        );
      }

      function notifyInlineHeight() {
        const rootEl = document.getElementById('root');
        if (!rootEl || !state.connected) return;
        const rectH = typeof rootEl.getBoundingClientRect === 'function'
          ? Math.ceil(rootEl.getBoundingClientRect().height || 0) : 0;
        const measured = Math.max(rootEl.scrollHeight || 0, rectH);
        const h = Math.min(state.inlineMaxHeight, Math.max(220, Math.ceil(measured + 12)));
        if (h === state.lastNotifiedHeight) return;
        state.lastNotifiedHeight = h;
        sendRpcNotification('ui/notifications/size-changed', { height: h });
      }

      function renderBoard(opts) {
        const root = document.getElementById('root');
        if (!root) return;
        const fromPoll = Boolean(opts && opts.fromPoll);

        if (fromPoll) {
          const sel = typeof window.getSelection === 'function' ? window.getSelection() : null;
          const hasSelection = Boolean(sel && !sel.isCollapsed);
          if (state.pointerDown || (Date.now() - state.lastUserScrollMs < 1500) || hasSelection) {
            state.pendingPollRender = true;
            if (!state.flushTimer) {
              state.flushTimer = setTimeout(() => {
                state.flushTimer = null;
                if (state.pendingPollRender) {
                  state.pendingPollRender = false;
                  renderBoard({ fromPoll: true });
                }
              }, 600);
            }
            return;
          }
        }

        const b = state.board;
        const summary = (b && b.summary) || {
          total_tasks: 0,
          running_tasks: 0,
          idle_tasks: 0,
          failed_or_interrupted_tasks: 0,
        };
        const anyRunning = summary.running_tasks > 0;
        const defMod = b && b.default_codex_model;
        const defModText =
          (defMod && defMod.resolved_model ? defMod.resolved_model : t('cliDefault')) +
          (defMod && defMod.reasoning_effort ? ' · ' + defMod.reasoning_effort : '');

        let tasks = (b && Array.isArray(b.tasks) ? b.tasks : []).slice();
        if (state.inlineFocusedOnly && state.initialFocusTaskId) {
          const focused = tasks.filter((x) => x.task_id === state.initialFocusTaskId);
          if (focused.length > 0) tasks = focused;
        } else if (state.filter === 'running') {
          tasks = tasks.filter((x) => x.state === 'running');
        } else if (state.filter === 'attention') {
          tasks = tasks.filter((x) => isTaskAttention(x));
        }

        const focusToggleBtn =
          b && b.tasks && b.tasks.length > 1
            ? '<button type="button" class="icon-btn" data-action="toggle-focus-scope">' +
              esc(state.inlineFocusedOnly ? t('showAllTasks') + ' (' + b.tasks.length + ')' : t('focusSingleTask')) +
              '</button>'
            : '';

        const filterBarHtml = state.inlineFocusedOnly
          ? ''
          : '<div class="filter-bar">' +
            '<div class="filter-tabs">' +
            '<button type="button" class="filter-tab' +
            (state.filter === 'all' ? ' active' : '') +
            '" data-action="set-filter" data-filter="all">' +
            esc(t('filterAll')) +
            '<span class="count-num">' + summary.total_tasks + '</span></button>' +
            '<button type="button" class="filter-tab' +
            (state.filter === 'running' ? ' active' : '') +
            '" data-action="set-filter" data-filter="running">' +
            esc(t('filterRunning')) +
            '<span class="count-num">' + summary.running_tasks + '</span></button>' +
            '<button type="button" class="filter-tab' +
            (state.filter === 'attention' ? ' active' : '') +
            '" data-action="set-filter" data-filter="attention">' +
            esc(t('filterAttention')) +
            '<span class="count-num">' + summary.failed_or_interrupted_tasks + '</span></button>' +
            '</div></div>';

        const selected = tasks.find(task => task.task_id === state.selectedTaskId) || tasks[0];
        state.selectedTaskId = selected?.task_id || null;
        const listHtml =
          tasks.length > 0
            ? '<div class="task-list">' + tasks.map(renderTaskCard).join('') + '</div>'
            : '<div class="empty-box"><div class="empty-title">' +
              esc(b ? t('emptyTitle') : t('loadingTitle')) +
              '</div><div>' +
              esc(t('emptyDesc')) +
              '</div></div>';

        const windowScrollY = typeof window.scrollY === 'number' ? window.scrollY : 0;
        for (const list of document.querySelectorAll('[data-activity-run]')) {
          state.activityScrollByRun.set(list.dataset.activityRun, list.scrollTop);
        }
        for (const el of document.querySelectorAll('[data-disclosure]')) state.disclosure.set(el.dataset.disclosure, el.open);
        for (const el of document.querySelectorAll('[data-scroll]')) state.scroll.set(el.dataset.scroll, el.scrollTop);

        const nextHtml =
          '<header class="topbar">' +
          '<div class="topbar-main">' +
          '<div class="brand">' +
          '<span class="brand-icon">PB</span>' +
          '<span class="brand-title">' + esc(t('boardTitle')) + '</span>' +
          '<span class="live-pill">' +
          '<span class="dot ' + (anyRunning ? 'pulse' : 'ok') + '"></span>' +
          '<span>' + esc(anyRunning ? t('liveSync') : t('idleSync')) + '</span>' +
          '</span>' +
          '</div>' +
          '<div class="topbar-actions">' +
          '<span class="default-model-chip mono" title="Default Codex CLI Model">' +
          esc(t('defaultModelPrefix')) + ' ' + esc(defModText) +
          '</span>' +
          focusToggleBtn +
          '<button type="button" class="icon-btn" data-action="refresh">↻ ' + esc(t('refresh')) + '</button>' +
          '<div class="seg-group" role="group" aria-label="Language">' +
          '<button type="button" class="seg-btn' + (state.lang === 'zh' ? ' active' : '') + '" data-action="set-lang" data-lang="zh">中文</button>' +
          '<button type="button" class="seg-btn' + (state.lang === 'en' ? ' active' : '') + '" data-action="set-lang" data-lang="en">EN</button>' +
          '</div>' +
          '</div></div>' +
          filterBarHtml +
          '</header>' +
          '<main class="workbench' + (state.showDetail ? ' show-detail' : '') + '">' +
          '<section class="master" data-scroll="master">' + listHtml + '</section>' +
          '<section class="inspector" data-scroll="' + esc('inspector/' + state.selectedTaskId) + '">' +
          (selected ? renderInspector(selected) : '<div class="inspector-empty">' + esc(t('selectTask')) + '</div>') +
          '</section></main>';

        if (fromPoll && nextHtml === state.lastRenderedHtml) {
          state.pendingPollRender = false;
          return;
        }

        state.restoringScroll = true;
        state.pendingPollRender = false;
        state.lastRenderedHtml = nextHtml;
        root.innerHTML = nextHtml;

        for (const el of document.querySelectorAll('[data-disclosure]')) {
          if (state.disclosure.has(el.dataset.disclosure)) el.open = state.disclosure.get(el.dataset.disclosure);
        }
        const applyScrollRestore = () => {
          for (const list of document.querySelectorAll('[data-activity-run]')) {
            list.scrollTop = state.activityScrollByRun.get(list.dataset.activityRun) || 0;
          }
          for (const el of document.querySelectorAll('[data-scroll]')) {
            el.scrollTop = state.followTail && el.dataset.scroll.startsWith('stream/')
              ? el.scrollHeight : state.scroll.get(el.dataset.scroll) || 0;
          }
          if (typeof window.scrollTo === 'function') window.scrollTo(0, windowScrollY);
        };
        applyScrollRestore();
        if (typeof requestAnimationFrame === 'function') {
          requestAnimationFrame(() => {
            applyScrollRestore();
            state.restoringScroll = false;
            notifyInlineHeight();
          });
        } else {
          state.restoringScroll = false;
          notifyInlineHeight();
        }
      }

      document.addEventListener('click', async (ev) => {
        const target = ev.target;
        const btn = target && typeof target.closest === 'function' ? target.closest('[data-action]') : null;
        if (!btn) return;
        const action = btn.getAttribute('data-action');

        if (action === 'set-lang') {
          ev.stopPropagation();
          state.lang = btn.getAttribute('data-lang') === 'en' ? 'en' : 'zh';
          renderBoard();
          return;
        }

        if (action === 'set-filter') {
          ev.stopPropagation();
          state.filter = btn.getAttribute('data-filter') || 'all';
          state.showDetail = false;
          renderBoard();
          await pollServerBoard();
          return;
        }

        if (action === 'set-stream-filter') {
          ev.stopPropagation();
          state.streamFilter = btn.getAttribute('data-stream-filter') || 'all';
          renderBoard();
          return;
        }

        if (action === 'toggle-focus-scope') {
          ev.stopPropagation();
          if (!state.inlineFocusedOnly) state.initialFocusTaskId = state.selectedTaskId;
          state.inlineFocusedOnly = !state.inlineFocusedOnly;
          renderBoard();
          await pollServerBoard();
          return;
        }

        if (action === 'refresh') {
          ev.stopPropagation();
          state.lastRenderedHtml = '';
          state.lastUserScrollMs = 0;
          state.pointerDown = false;
          await pollServerBoard();
          return;
        }

        if (action === 'jump-section') {
          ev.stopPropagation();
          const sec = btn.getAttribute('data-section');
          const el = sec && typeof document.querySelector === 'function'
            ? document.querySelector('[data-section-id="' + sec + '"]')
            : null;
          if (el) {
            if (el.tagName === 'DETAILS') el.open = true;
            el.scrollIntoView?.({ behavior: 'smooth', block: 'start' });
          }
          return;
        }

        if (action === 'toggle-prompt-expand') {
          ev.preventDefault?.();
          ev.stopPropagation();
          const key = btn.getAttribute('data-key');
          if (key) {
            if (state.promptExpanded.has(key)) state.promptExpanded.delete(key);
            else state.promptExpanded.add(key);
            state.disclosure.set(key + '/prompt', true);
            renderBoard();
          }
          return;
        }

        if (action === 'copy-id') {
          ev.stopPropagation();
          const val = btn.getAttribute('data-copy') || '';
          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(val);
              showToast(t('copied') + val);
            } catch {}
          }
          return;
        }

        if (action === 'open-file') {
          ev.stopPropagation();
          await openWorkspaceFileOrCopy(
            btn.getAttribute('data-uri'),
            btn.getAttribute('data-uri-line'),
            btn.getAttribute('data-raw')
          );
          return;
        }

        if (action === 'select-run') {
          ev.stopPropagation();
          const tid = btn.getAttribute('data-task');
          const rid = btn.getAttribute('data-run');
          if (tid && rid) {
            state.selectedRunByTask.set(tid, rid);
            renderBoard();
            await pollServerBoard();
          }
          return;
        }

        if (action === 'cancel-task') {
          ev.stopPropagation();
          const tid = btn.getAttribute('data-task');
          if (!tid || state.cancelingTasks.has(tid)) return;
          if (state.confirmCancelTask !== tid) {
            state.confirmCancelTask = tid;
            renderBoard();
            setTimeout(() => {
              if (state.confirmCancelTask === tid) {
                state.confirmCancelTask = null;
                renderBoard();
              }
            }, 3500);
            return;
          }
          state.confirmCancelTask = null;
          state.cancelingTasks.add(tid);
          renderBoard();
          try {
            await callServerTool('passbox_cancel', { task_id: tid });
            await pollServerBoard();
          } catch {} finally {
            state.cancelingTasks.delete(tid);
            renderBoard();
          }
          return;
        }

        if (action === 'select-task') {
          state.selectedTaskId = btn.getAttribute('data-task');
          state.showDetail = true;
          renderBoard();
          await pollServerBoard();
        } else if (action === 'back') {
          state.showDetail = false;
          renderBoard();
        } else if (action === 'follow') {
          state.followTail = !state.followTail;
          renderBoard();
        } else if (action === 'envelope') {
          ev.preventDefault?.();
          ev.stopPropagation();
          const key = btn.getAttribute('data-key');
          if (state.envelopes.has(key)) state.envelopes.delete(key);
          else state.envelopes.add(key);
          state.disclosure.set(key + '/prompt', true);
          renderBoard();
        } else if (action === 'copy-prompt') {
          ev.preventDefault?.();
          ev.stopPropagation();
          const detail = state.board.task_detail;
          const text = state.envelopes.has(btn.getAttribute('data-key')) ? detail.rendered_prompt : detail.objective_full;
          try { await navigator.clipboard.writeText(text); showToast(t('copied')); } catch {}
        }
      });

      window.addEventListener('pointerdown', () => { state.pointerDown = true; });
      const endPointer = () => {
        state.pointerDown = false;
        if (state.pendingPollRender) {
          state.pendingPollRender = false;
          renderBoard({ fromPoll: true });
        }
      };
      window.addEventListener('pointerup', endPointer);
      window.addEventListener('pointercancel', endPointer);
      window.addEventListener('resize', () => {
        if (state.connected && state.selectedTaskId && !state.board?.task_detail && detailVisible()) {
          void pollServerBoard();
        }
      });

      document.addEventListener('scroll', (ev) => {
        if (state.restoringScroll) return;
        const target = ev && ev.target;
        if (target && target.dataset) {
          if (target.dataset.scroll) {
            state.scroll.set(target.dataset.scroll, target.scrollTop || 0);
            if (target.dataset.scroll.startsWith('stream/') &&
                typeof target.scrollHeight === 'number' &&
                typeof target.clientHeight === 'number') {
              const dist = target.scrollHeight - (target.scrollTop || 0) - target.clientHeight;
              if (dist > 24 && state.followTail) state.followTail = false;
            }
          }
          if (target.dataset.activityRun) {
            state.activityScrollByRun.set(target.dataset.activityRun, target.scrollTop || 0);
          }
        }
        state.lastUserScrollMs = Date.now();
      }, true);

      document.addEventListener('toggle', () => {
        notifyInlineHeight();
      }, true);

      document.addEventListener('keydown', ev => {
        if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute?.('data-action') === 'select-task') {
          ev.preventDefault();
          ev.target.click();
        }
      });

      setInterval(() => {
        const nodes = document.querySelectorAll('[data-live-started]');
        for (const node of nodes) {
          const iso = node.getAttribute('data-live-started');
          if (!iso) continue;
          const elapsed = Math.max(0, Date.now() - Date.parse(iso));
          node.textContent = formatDuration(elapsed);
        }
      }, 1000);

      function schedulePollLoop() {
        clearTimeout(state.pollTimer);
        if (!state.connected) return;
        state.pollTimer = setTimeout(pollServerBoard, state.board?.summary?.running_tasks ? 1000 : 4500);
      }

      async function connectMcpApp() {
        const versions = ['2026-01-26', '2025-11-25', '2025-06-18'];
        for (const ver of versions) {
          try {
            const initRes = await sendRpcRequest('ui/initialize', {
              protocolVersion: ver,
              appInfo: { name: 'Passbox Status Board', version: '0.2.0' },
              appCapabilities: {
                availableDisplayModes: ['inline', 'fullscreen'],
              },
            });
            state.connected = true;
            if (initRes && initRes.hostContext) {
              applyHostContext(initRes.hostContext);
            }
            sendRpcNotification('ui/notifications/initialized', {});
            notifyInlineHeight();
            if (!state.board || (state.selectedTaskId && !state.board.task_detail && detailVisible())) {
              void pollServerBoard();
            }
            void schedulePollLoop();
            return;
          } catch {}
        }
      }

      if (typeof ResizeObserver === 'function') {
        const rootEl = document.getElementById('root');
        if (rootEl) new ResizeObserver(() => notifyInlineHeight()).observe(rootEl);
      }

      detectAmbientDarkTheme();
      renderBoard();
      void connectMcpApp();
    })();
  </script>
</body>
</html>
